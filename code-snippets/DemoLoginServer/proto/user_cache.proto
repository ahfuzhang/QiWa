syntax = "proto3";

package login_server;

option csharp_namespace = "DemoLoginServer.Protos";

// 用户缓存信息，存储在 Redis 中
// key: $user_id -> value: UserCacheValue (protobuf 序列化)
message UserCacheValue {
    // 用户名
    string user_name = 1;
    // 当前会话 ID
    string session_id = 2;
    // 最后登录时间（Unix 时间戳，秒）
    int64 last_login_time = 3;
}
