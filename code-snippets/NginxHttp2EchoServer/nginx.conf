worker_processes auto;

error_log /dev/stderr info;

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  text/plain;

    access_log off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;
    keepalive_requests 10000;

    # HTTP/2 tuning
    http2_max_concurrent_streams 500;
    http2_recv_buffer_size       256k;
    http2_idle_timeout           10m;
    http2_recv_timeout           30s;
    http2_max_field_size         16k;
    http2_max_header_size        32k;
    http2_chunk_size             8k;
    http2_body_preread_size      64k;

    server {
        listen 19082 http2;
        server_name _;

        location = /echo {
            content_by_lua_block {
                local headers = ngx.req.get_headers()
                local cl = tonumber(headers["content-length"])
                if cl and cl > 0 then
                    ngx.req.read_body()
                else
                    ngx.req.discard_body()
                end

                local method = ngx.req.get_method() or ""
                local host = ngx.var.host or ""
                local path = ngx.var.uri or ""
                local qs = (ngx.var.is_args or "") .. (ngx.var.query_string or "")
                local version = ngx.var.server_protocol or ""

                ngx.header.content_type = "text/plain"
                ngx.say(method .. " " .. host .. path .. qs .. " " .. version)

                local keys = {}
                for k, _ in pairs(headers) do
                    keys[#keys + 1] = k
                end
                table.sort(keys, function(a, b)
                    return a:lower() < b:lower()
                end)

                for _, k in ipairs(keys) do
                    local v = headers[k]
                    if type(v) == "table" then
                        v = table.concat(v, ",")
                    end
                    ngx.say(k .. ": " .. tostring(v))
                end
            }
        }

        location / {
            return 404;
        }
    }
}
